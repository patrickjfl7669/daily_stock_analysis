name: Daily TW Stock Analysis (Ultimate Fix)

on:
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '0 1 * * 0'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Random Delay
        run: sleep $((RANDOM % 60))
      
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests beautifulsoup4 lxml
      
      - name: Create Folders
        run: mkdir -p data logs reports

      - name: Override Config & Run Analysis (TW Only)
        env:
          # 強制覆蓋所有設定，優先級最高
          FORCE_TW_MODE: "true"
          STOCK_LIST: "TWII,TF,2330"
          MARKET_REVIEW_REGION: "tw"
          REPORT_LANGUAGE: "zh-TW"
          FETCH_TW_NEWS: "true"
          NEWS_SOURCES: "anue,yahoo_tw,cna,mops"
          ENABLE_AI_ANALYSIS: "true"
          
          # API Key（請確保你的 Secrets 裡有這些）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
          # Gmail 發信
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_SENDER }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465

          LOG_LEVEL: INFO
          MAX_WORKERS: 1

        run: |
          # 直接在執行前修改程式碼，強制覆蓋配置（確保一定生效）
          echo "import os" > config_override.py
          echo "os.environ['FORCE_TW_MODE'] = 'true'" >> config_override.py
          echo "os.environ['STOCK_LIST'] = 'TWII,TF,2330'" >> config_override.py
          echo "os.environ['MARKET_REVIEW_REGION'] = 'tw'" >> config_override.py
          echo "os.environ['REPORT_LANGUAGE'] = 'zh-TW'" >> config_override.py
          echo "os.environ['FETCH_TW_NEWS'] = 'true'" >> config_override.py
          echo "os.environ['NEWS_SOURCES'] = 'anue,yahoo_tw,cna,mops'" >> config_override.py
          echo "os.environ['ENABLE_AI_ANALYSIS'] = 'true'" >> config_override.py
          
          # 以強制覆蓋模式執行程式
          python -c "import config_override; import main; main.main()"
      
      - name: Keepalive
        if: github.event.schedule == '0 1 * * 0'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "Weekly keepalive"
          git push
      
      - name: Upload Reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: reports/
