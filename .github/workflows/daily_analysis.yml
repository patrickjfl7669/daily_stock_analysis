name: 每日台股分析｜四大新聞來源完整版

on:
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '0 1 * * 0'

  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 隨機延遲避免限流
        run: sleep $((RANDOM % 60))
      
      - name: 下載程式碼
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 設定 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安裝必要爬蟲套件
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests beautifulsoup4 lxml
      
      - name: 建立資料夾
        run: mkdir -p data logs reports

      - name: 啟用四大台股新聞來源 + 台股標的
        env:
          # 標的：台股大盤、台指期、2330
          STOCK_LIST: "TWII,TF,2330"
          MARKET_REVIEW_REGION: "tw"
          REPORT_LANGUAGE: zh-TW

          # 啟用新聞總開關
          FETCH_TW_NEWS: "true"
          # 四大來源一次開啟：鉅亨網、Yahoo財經、中央社、MOPS
          NEWS_SOURCES: "anue,yahoo_tw,cna,mops"

          # Gmail 發信設定（你已設定好不用改）
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_SENDER }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465

          LOG_LEVEL: INFO
          MAX_WORKERS: 1

        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "=========================================="
          echo "📈 每日台股分析｜四大新聞來源"
          echo "來源：鉅亨網 + Yahoo財經 + 中央社 + MOPS"
          echo "標的：大盤、台指期、2330 台積電"
          echo "語系：繁體中文"
          echo "=========================================="
          python main.py
      
      - name: 每週自動保活
        if: github.event.schedule == '0 1 * * 0'
        run: |
          git config --global user.name "GitHub 自動保活"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "每週自動保活｜維持排程執行"
          git push
      
      - name: 上傳報告日誌
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: 台股分析報告
          path: reports/
