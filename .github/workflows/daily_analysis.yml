name: Daily TW Stock Analysis (Final)

on:
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '0 1 * * 0'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Random Delay
        run: sleep $((RANDOM % 60))
      
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests beautifulsoup4 lxml
      
      - name: Create Folders
        run: mkdir -p data logs reports

      - name: Run Analysis
        env:
          # 確保 Secrets 正確傳入
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_SENDER }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465

          LOG_LEVEL: INFO
          MAX_WORKERS: 1

        run: python main.py
      
      - name: Keepalive
        if: github.event.schedule == '0 1 * * 0'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "Weekly keepalive"
          git push
      
      - name: Upload Reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: reports/
