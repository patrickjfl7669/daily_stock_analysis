name: Daily TW Stock Analysis

on:
  schedule:
    - cron: '0 10 * * 1-5'  # UTC10點 = 台灣時間18:00，平日執行
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 拉取程式碼
        uses: actions/checkout@v5

      - name: 設定Python環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴套件
        run: |
          pip install yfinance requests python-dotenv

      - name: 執行台股分析程式
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}
        run: python main.py
